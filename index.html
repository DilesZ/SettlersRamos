<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SettlersRamos — tributo original</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="err" style="display:none;position:fixed;left:8px;bottom:8px;max-width:90%;background:#7a1010;color:#fff;font:13px monospace;padding:8px;z-index:99"></div>
    <script>
      window.addEventListener('error', function (e) {
        var d = document.getElementById('err');
        d.style.display = 'block';
        d.textContent = 'Error: ' + (e.message || e.type);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
