name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run asset:check
        continue-on-error: true # S0: T002 pendiente (Lote 1 Nano Banana). Enforce estricto desde T003.
      - run: npm test --if-present
      - run: npm run build
